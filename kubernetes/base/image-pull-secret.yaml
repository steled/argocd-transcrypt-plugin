# Only needed if the ghcr.io package is private.
apiVersion: v1
kind: Secret
metadata:
  name: container-registry-credentials
  namespace: argocd
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded Docker config JSON
  # Create this secret with:
  # kubectl create secret docker-registry container-registry-credentials \
  #   --docker-server=ghcr.io \
  #   --docker-username=YOUR_USERNAME \
  #   --docker-password=YOUR_TOKEN \
  #   --docker-email=YOUR_EMAIL \
  #   -n argocd
  #
  # Or manually encode:
  # echo -n '{"auths":{"ghcr.io":{"username":"user","password":"token","email":"email@example.com","auth":"BASE64_OF_USER:TOKEN"}}}' | base64
  .dockerconfigjson: e30K  # Empty JSON object {} as placeholder
