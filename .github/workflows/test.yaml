name: 🧪 Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'tests/**'
      - 'kubernetes/**'
      - 'examples/**'
      - '.github/workflows/test.yaml'
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'tests/**'
      - 'kubernetes/**'
      - 'examples/**'
      - '.github/workflows/test.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
      
      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck docker/git-wrapper.sh
          shellcheck tests/*.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: argocd-transcrypt-plugin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ARGOCD_VERSION=v3.6.2
      
      - name: Test Docker image
        run: |
          docker run --rm argocd-transcrypt-plugin:test transcrypt --version
          docker run --rm argocd-transcrypt-plugin:test sh -c 'test -x /usr/local/bin/git-wrapper && git --version'
  
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: argocd-transcrypt-plugin:test
          cache-from: type=gha
          build-args: |
            ARGOCD_VERSION=v3.6.2
      
      - name: Run unit tests
        run: ./tests/test-git-wrapper.sh
      
      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Run integration tests
        run: ./tests/test-argocd-integration.sh
  
