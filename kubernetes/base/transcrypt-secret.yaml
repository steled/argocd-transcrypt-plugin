apiVersion: v1
kind: Secret
metadata:
  name: transcrypt-password
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: transcrypt-plugin
type: Opaque
stringData:
  # IMPORTANT: Replace the placeholder with the transcrypt password of your repository.
  # One key per repository: sanitized repository URL (protocol, user and .git removed,
  # ':' and '/' replaced by '_', lowercase), e.g. https://github.com/myorg/myrepo.git -> github.com_myorg_myrepo
  # DO NOT commit actual passwords to Git!
  # 
  # To create this secret with kubectl instead:
  #   kubectl create secret generic transcrypt-password \
  #     --from-literal=github.com_myorg_myrepo='your-transcrypt-password' \
  #     --from-literal=cipher='aes-256-cbc' \
  #     --namespace argocd
  #
  # For production, consider using external secret management:
  # - HashiCorp Vault
  # - AWS Secrets Manager
  # - Azure Key Vault
  # - External Secrets Operator
  github.com_myorg_myrepo: "REPLACE_WITH_YOUR_TRANSCRYPT_PASSWORD"
  cipher: "aes-256-cbc"
