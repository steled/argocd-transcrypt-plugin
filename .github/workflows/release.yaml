name: 📦 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.10.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Extract ArgoCD version from Dockerfile
          ARGOCD_VERSION=$(grep "ARG ARGOCD_VERSION=" docker/Dockerfile | cut -d'=' -f2)
          echo "ARGOCD_VERSION=$ARGOCD_VERSION" >> $GITHUB_OUTPUT
          
          # Create combined tag: v{argocd-version}-transcrypt-{plugin-version}
          COMBINED_TAG="${ARGOCD_VERSION}-transcrypt-${VERSION}"
          echo "COMBINED_TAG=$COMBINED_TAG" >> $GITHUB_OUTPUT
          
          echo "Plugin Version: $VERSION"
          echo "ArgoCD Version: $ARGOCD_VERSION"
          echo "Combined Tag: $COMBINED_TAG"
      
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=${{ steps.version.outputs.COMBINED_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ARGOCD_VERSION=${{ steps.version.outputs.ARGOCD_VERSION }}
            PLUGIN_VERSION=${{ steps.version.outputs.VERSION }}
      
      - name: Run tests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
        run: |
          ./tests/test-git-wrapper.sh "$IMAGE"
      
      - name: Run integration tests
        run: |
          # Install Kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Run integration tests
          chmod +x tests/test-argocd-integration.sh
          ./tests/test-argocd-integration.sh
      
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH'
      
      # - name: Upload Trivy results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'
      
      # - name: Check Trivy scan results
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
      #     format: 'table'
      #     exit-code: '1'
      #     severity: 'CRITICAL,HIGH'
      
      - name: Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            ARGOCD_VERSION=${{ steps.version.outputs.ARGOCD_VERSION }}
            PLUGIN_VERSION=${{ steps.version.outputs.VERSION }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            CHANGELOG.md

      - name: Update version references via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMBINED_TAG: ${{ steps.version.outputs.COMBINED_TAG }}
        run: |
          # The tag may have been created by the release step above (workflow_dispatch)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin

          # Only the newest release updates the references (not re-runs of old tags)
          LATEST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ "$LATEST" != "$VERSION" ]; then
            echo "$VERSION is not the latest release ($LATEST), skipping reference update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          BRANCH="chore/version-refs-${VERSION}"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          # Combined image tags (<argocd>-transcrypt-<plugin>) in docs, values and manifests
          FILES="README.md examples/helm-values.yaml $(find kubernetes -name '*.yaml')"
          # shellcheck disable=SC2086
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+-transcrypt-v[0-9]+\.[0-9]+\.[0-9]+/${COMBINED_TAG}/g" $FILES
          # Plugin image tags
          # shellcheck disable=SC2086
          sed -i -E "s#(ghcr\.io/steled/argocd-transcrypt-plugin:)v[0-9]+\.[0-9]+\.[0-9]+([^0-9.-]|$)#\1${VERSION}\2#g" $FILES
          sed -i -E "s#(newTag: )v[0-9]+\.[0-9]+\.[0-9]+#\1${VERSION}#" kubernetes/overlays/production/kustomization.yaml

          # Add a row to the version table in the README (newest first)
          ARGOCD_VERSION=$(grep "ARG ARGOCD_VERSION=" docker/Dockerfile | cut -d'=' -f2)
          TRANSCRYPT_VERSION=$(grep "ARG TRANSCRYPT_VERSION=" docker/Dockerfile | cut -d'=' -f2)
          ROW="| ${VERSION} | ${ARGOCD_VERSION} | ${TRANSCRYPT_VERSION} |"
          if ! grep -qF "| ${VERSION} |" README.md; then
            python3 - "$ROW" <<'PYEOF'
          import sys
          row = sys.argv[1]
          lines = open("README.md").read().split("\n")
          for i, line in enumerate(lines):
              if line.startswith("| Plugin version"):
                  lines.insert(i + 2, row)
                  break
          open("README.md", "w").write("\n".join(lines))
          PYEOF
          fi

          if git diff --quiet; then
            echo "No version reference changes to commit"
            exit 0
          fi

          git commit -am "chore: update version references to ${VERSION}"
          git push --force origin "$BRANCH"

          gh pr create \
            --title "chore: update version references to ${VERSION}" \
            --body "Automated update of image tags and version references after release ${VERSION} (${COMBINED_TAG})." \
            --base main \
            --head "$BRANCH"
